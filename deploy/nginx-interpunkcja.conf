# /etc/nginx/sites-available/interpunkcja (kopia referencyjna w repo)
# Architektura po migracji frontu publicznego na Astro:
#  - React SPA  (frontend/dist)        -> auth, panel, konto, historia, płatności, admin
#  - Astro SSR  (127.0.0.1:4322, PM2 interpunkcja-astro) -> strona główna, landingi, cennik, blog, strony prawne
#  - Backend    (127.0.0.1:3000, PM2 interpunkcja-backend) -> /api, /webhook, sitemapy

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name interpunkcja.com.pl www.interpunkcja.com.pl;
    return 301 https://www.interpunkcja.com.pl$request_uri;
}

# Apex -> www redirect (HTTPS)
server {
    listen 443 ssl;
    server_name interpunkcja.com.pl;

    ssl_certificate /etc/letsencrypt/live/interpunkcja.com.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interpunkcja.com.pl/privkey.pem;

    return 301 https://www.interpunkcja.com.pl$request_uri;
}

# Main site
server {
    listen 443 ssl;
    server_name www.interpunkcja.com.pl;

    ssl_certificate /etc/letsencrypt/live/interpunkcja.com.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interpunkcja.com.pl/privkey.pem;

    root /var/www/interpunkcja/frontend/dist;
    index index.html;

    # Aplikacja (React SPA): auth + panel + admin
    # no-store: index.html nie może być cache'owany, inaczej klienci widzą
    # starą wersję aplikacji po deployu (assety mają hash w nazwie, więc mogą
    # być immutable — sam HTML nie).
    location ~ ^/(panel|konto|historia|logowanie|rejestracja|sprawdz-email|weryfikacja|wyslij-ponownie|przypomnij-haslo|resetuj-haslo|platnosc|admin|auth)(/|$) {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # Assety SPA (Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sitemap proxy (backend)
    location ~ ^/sitemap.*\.xml$ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API proxy (backend)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Webhook proxy (Stripe)
    location /webhook {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assety Astro (hashowane) — cache immutable
    location /_astro/ {
        proxy_pass http://127.0.0.1:4322;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Publiczny front (Astro SSR): strona główna, landingi, cennik, blog, strony prawne
    location / {
        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
